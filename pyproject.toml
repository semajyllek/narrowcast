[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrowcast"
version = "0.2.0"
description = "Audit a classifier over a narrow label set: what it names, what it retreats to, and what it declines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
# There is no `encode` extra any more. narrowcast does not turn images into
# vectors: you bring posteriors or embeddings, and whatever produced them keeps
# ownership of torch, the encoder and the preprocessing.
dev = ["pytest>=8"]

[project.scripts]
narrowcast = "narrowcast.cli:main"

[tool.setuptools.packages.find]
include = ["narrowcast*"]
